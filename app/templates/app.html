<template id="t-home">
  <section class="mat"><div class="ruler-nums" aria-hidden="true"></div><div class="mat-inner">
    <h1>What are we making?</h1>
    <p class="lede">Pick a tool, answer a few questions, get a finished file. Fix anything by hand in the built-in editors — or let your own AI drive it.</p>
    <div class="tools">
      <!-- az átalakítás nem kerül nekünk semmibe: belépés nélkül is megy, ezért elöl áll, mindenki lássa -->
      <button class="tool" data-make="convert"><span class="obj"><span class="o-convert"><span class="paper a">DOCX</span><span class="paper b">PDF</span><b>⇄</b></span></span>
        <span class="label">Convert</span><span class="hint">Word, PDF, slides, sheets, images, e-books — any to any. Free, no account needed</span></button>
      <button class="tool" data-make="doc"><span class="obj"><span class="paper o-doc"><i></i><i></i><i></i><i></i><i></i><i></i></span></span>
        <span class="label">Document</span><span class="hint">Write or edit like in Word — letters, reports, CVs; start blank or from a brief</span></button>
      <button class="tool" data-make="deck"><span class="obj"><span class="paper o-deck"><i></i><i></i><i></i><b></b></span></span>
        <span class="label">Presentation <em class="ai-badge">AI</em></span><span class="hint">Slides from a short brief, with photos and charts</span></button>
      <button class="tool" data-make="social"><span class="obj"><span class="paper o-post"><div></div><span></span></span></span>
        <span class="label">Social post</span><span class="hint">One design, every platform size at once</span></button>
      <button class="tool" data-make="print"><span class="obj"><span class="paper o-poster">Big<br>idea.</span></span>
        <span class="label">Print design</span><span class="hint">Posters, flyers, report covers, certificates — or rebuild one from a photo</span></button>
      <button class="tool" data-make="infographic"><span class="obj"><span class="paper o-chart"><b>+86%</b><span><i></i><i></i><i></i><i></i></span></span></span>
        <span class="label">Infographic <em class="ai-badge">AI</em></span><span class="hint">A spreadsheet in, the key numbers and charts out — every number checked</span></button>
      <button class="tool" data-make="photo"><span class="obj"><span class="paper o-photo"><div></div></span></span>
        <span class="label">Photos</span><span class="hint">Edit with words, restore old family photos, cut out</span></button>
      <button class="tool" data-make="book"><span class="obj"><span class="o-book paper"><i></i><i></i></span></span>
        <span class="label">Book</span><span class="hint">Your manuscript as a print-ready book PDF — or a photo album</span></button>
      <button class="tool" data-make="video"><span class="obj"><span class="paper o-video"><b></b><i></i><i></i><i></i></span></span>
        <span class="label">Video <em class="ai-badge">AI</em></span><span class="hint">An article or your text as a short video — titles, pictures, captions; edit it on a timeline</span></button>
      <button class="tool" data-make="scan"><span class="obj"><span class="o-scan"><span class="paper"><i></i><i></i><i></i><i></i><i></i></span></span></span>
        <span class="label">Scan to text <em class="ai-badge">AI</em></span><span class="hint">Old books and photographed pages → Word, a new PDF, searchable PDF</span></button>
      <button class="tool" data-make="pdf"><span class="obj"><span class="paper o-pdf"><i></i><i></i><i class="x"></i><i></i><i></i><b>PDF</b></span></span>
        <span class="label">PDF tools</span><span class="hint">Merge, compress, black out, number, protect, to Word</span></button>
    </div>
  </div></section>
  <section class="sheet intro">
    <div class="how">
      <div><b>1</b><h3>Pick a tool, or open a file</h3><p>Upload a manuscript, a scan, a deck, a photo or a PDF — or start from a short brief.</p></div>
      <div><b>2</b><h3>Get a finished file</h3><p>Real Word, PowerPoint, PDF and Photoshop files. Fix anything by hand in the built-in editors.</p></div>
      <div><b>3</b><h3>Ask for changes in plain words</h3><p>Every change is a new version — go back any time. Photos keep every step on its own layer.</p></div>
    </div>
    <h2 class="try-title">Things to try</h2>
    <div class="try">
      <button data-try="grass"><span>Photos</span>“Remove the blurry grass in front of the animal”</button>
      <button data-try="backdrop"><span>Photos</span>“Put the Parliament behind it, crop to 4:5, headline at the top”</button>
      <button data-try="restore"><span>Photos · restore</span>Photograph a whole album page — every old print is found, repaired and coloured</button>
      <button data-try="oldbook"><span>Scan to text</span>Phone photos of an old book → Word, a new book PDF, a searchable PDF</button>
      <button data-try="book"><span>Book · then ask</span>“On page 22 add a photo of the Colosseum” · “indent every paragraph after the third”</button>
      <button data-try="deck"><span>Presentation</span>A brief → a designed deck; attach a pptx you like as the style example</button>
      <button data-try="redact"><span>PDF tools</span>Black out names for good — they're removed from the file, not just covered</button>
      <button data-try="form"><span>Forms</span>Photo of a paper form → a fillable PDF; fill one, or a hundred from a spreadsheet</button>
      <button data-try="rebuild"><span>Print design · rebuild</span>A photo of a poster → the same design, every word editable</button>
      <button data-try="infographic"><span>Infographic</span>A spreadsheet → the key numbers and charts, each number traced to its cell</button>
      <button data-try="album"><span>Book · photo album</span>Your photos and a few pages of text → a print-ready album with contents and captions</button>
    </div>
    <p class="muted small connect-note">Use it from your own AI too — Claude, ChatGPT, Cursor: <a href="/app/connect">Connect your AI</a>. Without an account you can try everything that doesn't use AI.</p>
    <p class="muted small more-note">Every format and tool: <a href="{{CONVERT_URL}}">{{N_FORMATS}} file formats</a> · <a href="{{TOOLS_URL}}">{{N_TOOLS}} file tools</a> · <a href="{{AGENTS_URL}}">what the AI agents do</a> · <a href="{{API_URL}}">REST API</a></p>
  </section>

    <div class="row-head"><h2>Recent</h2><a class="small" href="/app/files">All files</a></div>
    <div class="files" id="recent"></div>
  </section>

<template id="t-connect">
  <section class="sheet connect" style="max-width:900px">
    <h2>Connect your AI</h2>
    <p class="muted lede">Use Studio from ChatGPT, Claude, Cursor or VS Code: they make and change files in your account, and every result comes with a link that opens it here.</p>
    <div class="card addr-card">
      <span class="addr-label">Your connection address</span>
      <div class="addr-row"><code class="keybox" id="mcp-addr"></code><button class="btn primary" id="mcp-copy" type="button">Copy</button></div>
      <p class="muted small" style="margin:0">Paste it into your AI app. It asks you to sign in here once and press <b>Allow</b> — no keys to copy.</p>
    </div>
    <div class="clients">
      <article class="client"><h3>ChatGPT</h3>
        <ol><li>Settings → <b>Apps &amp; Connectors</b> → Advanced settings → turn on <b>Developer mode</b>.</li>
          <li><b>Create</b> a connector, paste the address, leave authentication on <b>OAuth</b>.</li>
          <li>Sign in here, press <b>Allow</b> — then pick it in a chat from the <b>+</b> menu.</li></ol></article>
      <article class="client"><h3>Claude</h3>
        <ol><li>Settings → <b>Connectors</b> → <b>Add custom connector</b>.</li>
          <li>Paste the address → <b>Add</b> → <b>Connect</b>.</li>
          <li>Sign in here and press <b>Allow</b>.</li></ol></article>
      <article class="client"><h3>Cursor</h3>
        <ol><li>Click the button — Cursor opens and adds it.</li><li>Sign in here and press <b>Allow</b>.</li></ol>
        <a class="btn" id="add-cursor">Add to Cursor</a></article>
      <article class="client"><h3>VS Code</h3>
        <ol><li>Click the button — VS Code adds it to Copilot's tools.</li><li>Sign in here and press <b>Allow</b>.</li></ol>
        <a class="btn" id="add-vscode">Add to VS Code</a></article>
      <article class="client"><h3>Claude Code</h3>
        <ol><li>Run this in your terminal, then <b>/mcp</b> → sign in.</li></ol>
        <code class="keybox" id="cc-cmd"></code><button class="btn ghost" type="button" id="cc-copy">Copy</button></article>
    </div>
    <h3 class="sub">Connected apps and keys</h3>
    <p class="muted small" id="keys-empty" style="margin:4px 0 0">Nothing connected yet.</p>
    <ul class="keys" id="keys"></ul>
    <details class="advanced"><summary>Advanced: use a key instead (MCP and REST API)</summary>
      <p class="muted small" style="margin:0 0 12px">For scripts and apps that can't sign in, and for the <a href="{{DOCS_URL}}">REST API</a>. The key works like a password — keep it private.</p>
      <label>Key name<input type="text" id="key-name" placeholder="e.g. Claude on my laptop" maxlength="60"></label>
      <label class="check-line" style="display:flex;gap:8px;align-items:center;font-weight:500"><input type="checkbox" id="key-sandbox" style="width:auto"> Test key (sandbox) — free, files up to 10 MB, results kept for an hour; for building against the API</label>
      <button class="btn" id="key-create" type="button">Create key</button>
      <div id="key-new" hidden style="margin-top:16px">
        <p class="small"><strong>Copy it now</strong> — the key is shown only once.</p>
        <p class="small" style="margin:0 0 4px">REST API key (<span class="mono">Authorization: Bearer …</span>):</p>
        <div class="keybox" id="key-raw"></div>
        <p class="small" style="margin:12px 0 4px">MCP address with the key:</p>
        <div class="keybox" id="key-url"></div>
        <p class="small muted" style="margin-top:10px">Claude Code: <span class="mono" id="key-cc"></span></p>

    <h2 style="margin-top:32px">Credits</h2>

<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
// [szerkesztő, gomb-felirat, formátumok] — egy formátumnál az első találat az elsődleges (pl. PDF: PDF-szerkesztő, aztán dizájn)
const EDITORS = [
  ["wordcraft", "Edit document", ["docx","doc","odt","rtf","md","html","htm","txt","tex"]],
  ["deckcraft", "Edit slides", ["pptx","deckcraft"]],
  ["pdfcraft", "Edit PDF", ["pdf"]],
  ["gridcraft", "Edit sheet", ["xlsx","csv","tsv"]],
  ["photocraft", "Edit image", ["png","jpg","jpeg","webp","psd","psb","tif","tiff","bmp","gif","exr","pcraft"]],
  ["designcraft", "Edit layout", ["designcraft","idml"]],
  ["vectorcraft", "Edit as design", ["svg","svgz","pdf","ai","eps","vectorcraft"]],
  ["effectcraft", "Edit video", ["ecproj"]],
  ["filmcraft", "Cut video", ["mp4","mov","webm","m4v","mkv","fcproj"]],
];
const editorsFor = ext => EDITORS.filter(([, , exts]) => exts.includes((ext || "").toLowerCase()));
const EDITOR_NAMES = { wordcraft: "Word editor", deckcraft: "slide editor", pdfcraft: "PDF editor", gridcraft: "spreadsheet editor",
  photocraft: "photo editor", designcraft: "layout editor", vectorcraft: "design editor", effectcraft: "video editor", filmcraft: "video cutter" };
let account = null, files = [];

function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.remove("act"); t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 3800); }
function toastAction(msg, label, fn, ms = 8000) {      // üzenet + egy gomb (pl. „Undo”), amíg látszik
  const t = $("#toast"); t.innerHTML = `<span>${esc(msg)}</span><button type="button">${esc(label)}</button>`; t.classList.add("show", "act");
  t.querySelector("button").addEventListener("click", () => { clearTimeout(t._h); t.classList.remove("show", "act"); fn(); }, { once: true });
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show", "act"), ms);
}
async function api(path, opts = {}) {
  const r = await fetch(path, { headers: opts.body && !(opts.body instanceof FormData) ? { "Content-Type": "application/json" } : {}, ...opts });
  const data = r.headers.get("content-type")?.includes("json") ? await r.json() : await r.text();
  if (r.status === 401 && data?.account_required) throw Object.assign(new Error(data.detail || AI_NOTE), { cta: true });   // vendég AI-n: fiók-ajánlat
  if (r.status === 401) { location.href = "/login?next=" + encodeURIComponent(here()); throw new Error("signed out"); }
  if (!r.ok) throw new Error((data && data.detail) || data.error || `Request failed (${r.status})`);
  return data;
}

// ---------- fiók ----------
async function loadAccount() {
  account = await api("/api/account");
  $("#credits").textContent = account.credits === null ? "credits ∞" : `${account.credits} credits`;
  for (const [id, show] of [["credits", !account.guest], ["signout", !account.guest], ["signin", account.guest], ["signup", account.guest]])
    $("#" + id).hidden = !show;
  document.body.classList.toggle("guest", !!account.guest);
}
const AI_NOTE = "This uses AI — create a free account to use it.";
const AI_MAKERS = new Set(["scan", "infographic"]);
const SLUGS = { convert: "convert", doc: "document", deck: "presentation", social: "social-post", print: "print-design", infographic: "infographic",
  photo: "photos", book: "book", video: "video", scan: "scan-to-text", pdf: "pdf-tools" };   // a sorrend = a csempék és a fiók fülei
const MODES = {   // eszköz → [mód-mező, {érték: link-szó}]
  doc: ["dmode", { template: "new", brief: "from-brief", open: "open" }],
  deck: ["pmode", { blank: "new", brief: "from-brief", document: "from-document", open: "open" }],
  photo: ["mode", { new: "new", edit: "edit", restore: "restore", quick: "quick-fix", open: "open" }],
  social: ["start", { new: "new", design: "design" }],
  print: ["start", { new: "new", template: "from-template", rebuild: "rebuild-from-picture" }],
  book: ["start", { new: "new", manuscript: "from-manuscript", album: "photo-album" }],
  video: ["vmode", { new: "new", article: "from-article", text: "from-text" }],
  pdf: ["action", { new: "new", open: "open", merge: "merge", compress: "compress", to_word: "to-word", page_numbers: "page-numbers",
    watermark: "watermark", redact: "black-out", protect: "lock", ocr: "make-searchable", compare: "compare", make_fillable: "make-fillable" }],
};
const makeLink = (kind, mode, src, slot) => `/app/make/${SLUGS[kind]}` + (mode && MODES[kind]?.[1][mode] ? `/${MODES[kind][1][mode]}` : "")
  + (src ? `?src=${encodeURIComponent(src)}` + (slot ? `&slot=${encodeURIComponent(slot)}` : "") : "");       // a Presentationnek van AI nélküli módja (New / Open a file)
function accountCta(title, alt = "") {     // alt: fiók nélküli következő lépés (pl. Scan → üres dokumentum)
  const form = $("#make-form");

// hosszú munka (job) követése: a státuszsort frissíti, a végén az eredményt adja
async function pollJob(job, label, st = $("#make-status")) {
  while (job.status === "running") {
    if (st) st.textContent = label(job);
    await new Promise(r => setTimeout(r, 2000));
    job = await api(`/api/jobs/${job.id}`);
  }
  if (job.status !== "done") throw new Error(job.error || "Something went wrong — try again.");
  return job.result;
}

const IMG = ["png","jpg","jpeg","webp","gif","bmp"];
const REL = new Intl.RelativeTimeFormat("en", { numeric: "auto", style: "short" });
function ago(ts) {
  const s = Date.now() / 1000 - ts;
  if (s < 60) return "just now";
  for (const [unit, n] of [["minute", 60], ["hour", 3600], ["day", 86400]])
    if (s < n * (unit === "day" ? 7 : unit === "hour" ? 24 : 60)) return REL.format(-Math.floor(s / n), unit);
  return new Date(ts * 1000).toLocaleDateString("en", { day: "numeric", month: "short", year: "numeric" });
}
const size = kb => kb < 1 ? "<1 kB" : kb < 1024 ? `${kb} kB` : `${(kb / 1024).toFixed(1)} MB`;

function fileCard(f) {

// nyomtatás: a szerver PDF-et ad (Word, pptx, táblázat, kép, PSD… → PDF), a böngésző azt nyomtatja
async function printFile(id) {
  toast("Getting it ready to print…");
  try {
    const r = await fetch(`/api/print/${encodeURIComponent(id)}`);
    if (!r.ok) { let m = "Could not print this file."; try { m = (await r.json()).detail || m; } catch {} throw new Error(m); }
    const url = URL.createObjectURL(await r.blob());
    const fr = document.createElement("iframe");
    fr.className = "print-frame"; fr.title = "Print"; fr.src = url;
    fr.onload = () => setTimeout(() => {
      try { fr.contentWindow.focus(); fr.contentWindow.print(); } catch { window.open(url, "_blank"); }
      setTimeout(() => { fr.remove(); URL.revokeObjectURL(url); }, 120000);
    }, 250);
    document.body.append(fr);
  } catch (e) { toast(e.message); }
}
const BANDS = { pptx: "#FF5A36", ppt: "#FF5A36", pdf: "#C2362B", docx: "#2F80ED", doc: "#2F80ED", odt: "#2F80ED",
  xlsx: "#1E9E6A", csv: "#1E9E6A", md: "#5C6870", txt: "#5C6870", svg: "#8E44AD", vectorcraft: "#8E44AD", psd: "#2F5D7C" };
function glyph(ext) {
  const wide = ["pptx", "ppt", "key"].includes(ext);
  return `<span class="glyph${wide ? " wide" : ""}" style="--band:${BANDS[ext] || "#5C6870"}"><i></i><i></i><i></i>${wide ? "" : "<i></i><i></i>"}<b>${esc(ext.toUpperCase())}</b></span>`;
}
// egy készítés testvér-fájljai (méretek × formátumok) EGY kártyán: a szerkeszthető változat nyílik, a kártya mondja, hány fájl
const GROUP_PICK = ["ecproj", "vectorcraft", "docx", "png", "pdf"];     // videó: a szerkeszthető projekt a kártya (az MP4 a Downloadban)
const cardName = f => {   // natív formátum: kiterjesztés nélkül; több méret egy kártyán: a méret-jelölő nélkül
  const t = NATIVE[f.ext] || f._n > 1 ? fileTitle(f) : f.label;
  return f._n > 1 && f.variant ? t.replace(new RegExp(`\\s*\\(${f.variant}\\)$`, "i"), "") : t;
};
const pickRank = f => { const i = GROUP_PICK.indexOf(f.ext); return (i < 0 ? 9 : i) + (f.variant && f.variant !== "square" ? 0.5 : 0); };
function groupFiles(list) {
  const seen = new Map(), out = [];
  for (const f of list) {
    if (!f.group) { out.push(f); continue; }
    const g = seen.get(f.group);
    if (!g) { const c = { ...f, _n: f._n || 1 }; seen.set(f.group, c); out.push(c); }
    else { g._n += f._n || 1; if (pickRank(f) < pickRank(g)) Object.assign(g, f, { _n: g._n }); }
  }
  return out;
}

const WS_KINDS = { doc: ["docx", "doc", "odt", "rtf", "md", "txt", "html", "htm", "epub"], deck: ["pptx", "ppt", "odp", "key", "deckcraft"],
  pdf: ["pdf"], image: ["png", "jpg", "jpeg", "webp", "gif", "bmp", "psd", "psb", "tif", "tiff", "heic", "avif"],
  design: ["vectorcraft", "designcraft", "svg", "ai", "eps", "idml"], sheet: ["xlsx", "xls", "csv", "tsv", "ods"],
  video: ["ecproj", "fcproj", "mp4", "mov", "webm", "m4v", "mkv"] };
const WS_LABELS = { doc: "Documents", deck: "Presentations", pdf: "PDFs", image: "Images", design: "Designs", sheet: "Spreadsheets", video: "Videos", other: "Other" };
const normName = t => (t || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^0-9a-z]+/g, " ").trim();
// ugyanannak a fájlnak a változatai (szerver: chain / older_versions / superseded_by): alapból csak a legfrissebb
// látszik, a „+N older versions” helyben lenyitja a többit (10-13: öt „… diasor (vN)” egymás mellett összezavart)
const openChains = new Set();
function collapseVersions(list) {
  const ids = new Set(list.map(f => f.file_id));
  return list.filter(f => !f.superseded_by || !ids.has(f.superseded_by) || openChains.has(f.chain))
             .map(f => f.superseded_by && ids.has(f.superseded_by) ? { ...f, _older: true } : f);
}
function renderFiles(el, list) {
  const all = list;
  list = groupFiles(collapseVersions(list));
  el.innerHTML = list.length ? list.map(fileCard).join("") : `<div class="empty">Nothing here yet — <a href="/app">make something</a>, or <a href="#" data-upload>upload a file</a>.</div>`;
  el.querySelector("[data-upload]")?.addEventListener("click", e => { e.preventDefault(); pickAndOpen(); });   // a szöveg ígér valamit → vigyen is oda
  el.querySelectorAll(".file").forEach(b => b.addEventListener("click", () => nav("/app/file/" + encodeURIComponent(b.dataset.id))));
  el.querySelectorAll("[data-print]").forEach(b => b.addEventListener("click", () => printFile(b.dataset.print)));
  el.querySelectorAll(".older-toggle").forEach(b => b.addEventListener("click", () => {
    const c = b.dataset.chain; openChains.has(c) ? openChains.delete(c) : openChains.add(c); renderFiles(el, all);
  }));
  // nincs bélyegkép (ismeretlen típus, render-hiba) → típus-ikon
  el.querySelectorAll(".thumb img").forEach(img => img.addEventListener("error", () => { const t = img.parentElement; t.innerHTML = glyph(t.dataset.ext); }, { once: true }));
}

function leaveNewOnFile(form, field, fallback) {

function withNew(kind, m, other, otherLabel, extra = []) {

    cta: form => { const v = form.querySelector("[name=start]:checked")?.value;

    fields: () => `${seg("start", [["new", "New"], [other, otherLabel], ...extra.map(e => [e.value, e.label])], 1)}<div data-start="new" hidden>${blankFields(kind)}</div><div data-start="${other}">${m.fields()}</div>`
      + extra.map(e => `<div data-start="${e.value}" hidden>${e.fields()}</div>`).join(""),
    wire(form, o) {
      m.wire?.(form, o); wireBlank(form); extra.forEach(e => e.wire?.(form, o));
      const sync = () => { const v = form.querySelector("[name=start]:checked")?.value; form.querySelectorAll("[data-start]").forEach(d => d.hidden = d.dataset.start !== v); };
      form.querySelectorAll("[name=start]").forEach(r => r.addEventListener("change", sync)); sync();

const CONVERT_GROUPS = { document: "Documents", spreadsheet: "Spreadsheets", presentation: "Presentations", ebook: "E-books", image: "Images",
  vector: "Vector", video: "Video", audio: "Audio", archive: "Archives", cad: "CAD", font: "Fonts" };
function convertOptions(targets) {     // a bevált (leggyakoribb) célok elöl, a többi formátum kategóriánként
  const opt = x => `<option value="${x.fmt}">${esc(x.label)}</option>`;
  const top = targets.filter(x => x.top !== false), rest = targets.filter(x => x.top === false);
  if (!rest.length) return top.map(opt).join("");
  const groups = {};
  rest.forEach(x => (groups[x.category || "other"] ||= []).push(x));
  return (top.length ? `<optgroup label="Most used">${top.map(opt).join("")}</optgroup>` : "") + Object.entries(groups).map(([k, xs]) =>
    `<optgroup label="${esc(CONVERT_GROUPS[k] || "Other")}">${xs.map(opt).join("")}</optgroup>`).join("");
}

  form.onsubmit = async e => {
    e.preventDefault();
    if (account?.guest) return accountCta("Ask for a change");
    const instruction = input.value.trim(); if (!instruction && !styleId) { input.focus(); return; }
    const app = (($("#file-frame").getAttribute("src") || "").match(/\/editor\/(\w+)\//) || [])[1];
    const go = $("#rev-go"); go.disabled = true; input.disabled = true;
    try {
      if (!(await saveEditorFirst(m => st.textContent = m))) { go.disabled = false; input.disabled = false; return; }
      st.textContent = "Working on it…";
      const branch = $("#rev-branch").getAttribute("aria-pressed") === "true" ? ($("#rev-branch-name").value.trim() || "New branch") : "";
      const job = await api("/api/make/revise", { method: "POST", body: JSON.stringify({ file_id: cur.file_id, instruction, style_file_id: styleId, branch }) });
      const r = await pollJob(job, () => "Working on it…", st);
      toast(r.summary || "Done — new version");
      if (r.pictures_changed?.length) try {     // a kép csak alapérték: a választó magától nyílik rá
        sessionStorage.setItem("aice-pick:" + r.file_id, JSON.stringify({ ...r.pictures_changed[0],
          note: `Is this the picture you wanted on ${r.pictures_changed[0].where.split(" · ")[0].toLowerCase()}? Pick another one — or generate one with AI.` }));
      } catch {}
      await loadAccount();
      const sameEditor = app && editorsFor(r.file_id.split(".").pop()).some(([a]) => a === app);   // szerkesztőből: ott marad
      nav("/app/file/" + encodeURIComponent(r.file_id) + (sameEditor ? `/edit/${app}` : ""));
    } catch (err) { st.textContent = err.message; go.disabled = false; input.disabled = false; }
  };
}

// ---------- tartalmi ellenőrzés (10-14): egység · tények · élő adatok, a szerkesztő mellett ----------
// A leletek egy „kosárba” kerülnek (Comment / Fix), és EGY mozdulattal mennek a dokumentumba — új változatként, a
// szerkesztő margóján megjegyzésként, a javítás követett változásként (Accept / Reject). Figyelő módban a szerkesztő
// egy gépelési szünet után csendes pillanatképet küld (nem új változat), és az ellenőrzés azon fut.
const CK_KIND = { contradiction: ["Contradiction", "bad"], tone: ["Tone", "warn"], term: ["Wording", "warn"] };
const CK_VERDICT = { contradicted: ["Wrong", "bad"], outdated: ["Outdated", "warn"], unverified: ["Not settled", ""], supported: ["Confirmed", "ok"] };
const CK_WATCH = "aice-watch";
let ckAbort = null;
function wireChecks(f) {
  ckAbort?.abort(); ckAbort = null;
  if (f.ext !== "docx") return;
  const btn = $("#btn-check"), panel = $("#checks"), badge = $("#ck-badge");
  btn.hidden = false;
  const ac = new AbortController(); ckAbort = ac;
  const st = { tab: "consistency", res: null, facts: null, live: null, busy: false, picked: new Map(), dismissed: new Set(),
    lastRun: 0, lastActivity: 0, changed: false, source: null };
  let watch = false; try { watch = localStorage.getItem(CK_WATCH) === "1"; } catch {}
  panel.innerHTML = `<div class="ck-head"><strong>Checks</strong><button type="button" class="ck-x" aria-label="Close checks">✕</button></div>
    <div class="ck-tabs" role="tablist">
      <button type="button" role="tab" data-tab="consistency">Consistency<span class="ck-n"></span></button>
      <button type="button" role="tab" data-tab="facts">Facts<span class="ck-n"></span></button>
      <button type="button" role="tab" data-tab="live">Live data<span class="ck-n"></span></button></div>
    <div class="ck-bar"></div><p class="ck-status" role="status" aria-live="polite"></p>
    <div class="ck-list"></div>
    <div class="ck-foot"><button type="button" class="btn primary" id="ck-apply" disabled>Put into the document</button><span class="muted" id="ck-picked"></span></div>`;
  const say = m => { panel.querySelector(".ck-status").textContent = m || ""; };
  const frame = () => $("#file-frame");
  const inEditor = () => /\/editor\/wordcraft\//.test(frame()?.getAttribute("src") || "");
  const open = v => {
    panel.hidden = !v; btn.setAttribute("aria-expanded", String(v));
    try { sessionStorage.setItem("aice-checks", v ? "1" : ""); } catch {}
    if (v && !st.res && !st.busy) runCheck(false);
  };
  btn.addEventListener("click", () => open(panel.hidden), { signal: ac.signal });
  panel.querySelector(".ck-x").addEventListener("click", () => open(false), { signal: ac.signal });
  panel.querySelector(".ck-tabs").addEventListener("click", e => {
    const b = e.target.closest("[data-tab]"); if (!b) return;
    st.tab = b.dataset.tab; draw();
    if (st.tab === "live" && !st.live) loadLive();
  }, { signal: ac.signal });

  // ---- futtatás ----
  async function runCheck(facts, snapshot_id = null) {
    if (st.busy) return;
    if (account?.guest) return accountCta("Check the facts");
    st.busy = true; drawBar();
    try {
      const job = await api("/api/check", { method: "POST", body: JSON.stringify(snapshot_id ? { snapshot_id, facts } : { file_id: cur.file_id, facts }) });
      const r = await pollJob(job, j => j.stage === "looking up the sources" || j.stage === "weighing the evidence"
        ? `Checking facts${j.total ? ` (${Math.min(j.done + 8, j.total)} of ${j.total})` : ""}…` : facts ? "Finding the facts to check…" : "Reading the document…",
        panel.querySelector(".ck-status"));
      st.res = r.consistency; if (r.facts) st.facts = r.facts;
      st.source = snapshot_id ? "your latest edits" : "the saved version";
      st.lastRun = Date.now();
      const nc = visible(st.res?.findings).length, nf = (st.facts?.claims || []).filter(c => ["contradicted", "outdated"].includes(c.verdict)).length;
      say(`Checked ${st.source} · ${new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}` + (r.facts ? "" : nc ? "" : " — nothing found"));
      if (facts) loadAccount();
    } catch (err) { say(err.message); }
    st.busy = false; draw();
  }
  const visible = list => (list || []).filter(x => !st.dismissed.has(x.id));

  // ---- figyelő mód: gépelési szünet után pillanatkép ----
  const tick = setInterval(() => {
    if (!watch || st.busy || !st.changed || panel.hidden || !inEditor()) return;
    const now = Date.now();
    if (now - st.lastActivity < 5000 || now - st.lastRun < 40000) return;
    st.changed = false; st.busy = true; say("Looking at your latest edits…");
    frame().contentWindow.postMessage({ target: "aice_bridge", cmd: "snapshot" }, location.origin);
    setTimeout(() => { if (st.busy && !st.res) st.busy = false; }, 20000);
  }, 2000);
  ac.signal.addEventListener("abort", () => clearInterval(tick));
  window.addEventListener("message", e => {
    if (e.origin !== location.origin || e.data?.source !== "wordcraft") return;
    if (e.data.type === "activity" || e.data.type === "touched") { st.lastActivity = Date.now(); st.changed = true; }
    if (e.data.type === "snapshot") { st.busy = false; runCheck(!!st.watchFacts, e.data.snapshot_id); }
    if (e.data.type === "snapshot_failed") { st.busy = false; say("Couldn't read your latest edits — Check now uses the saved version."); }
  }, { signal: ac.signal });

  // ---- kosár → dokumentum ----
  function itemsOf(id, mode) {
    const c = (st.res?.findings || []).find(x => x.id === id), fct = (st.facts?.claims || []).find(x => x.id === id);
    if (c) {
      const [kind] = CK_KIND[c.kind] || ["Check"];
      if (mode === "fix" && c.fix) return [{ id, quote: c.fix.quote, paragraph: c.fix.paragraph, replacement: c.fix.replacement, comment: `${kind}: ${c.note}` }];
      return c.places.map((p, k) => ({ id: k ? `${id}.${k}` : id, quote: p.quote, paragraph: p.paragraph,
        comment: `${kind}: ${c.note}` + (c.places.length > 1 ? `\nSee also: “${c.places.filter((_, j) => j !== k).map(x => x.quote).join("”, “")}”` : "") }));
    }
    if (fct) {
      const [lab] = CK_VERDICT[fct.verdict] || ["Fact check"], s = fct.source || {};
      const src = s.type === "web" ? `${s.title || ""} ${s.url || ""}`.trim() : s.source_name ? `${s.source_name}${s.period ? ", " + s.period : ""} ${s.source_url || ""}`.trim() : "";
      return [{ id, quote: fct.quote, paragraph: fct.paragraph, comment: `Fact check — ${lab}: ${fct.explanation}` + (src ? `\nSource: ${src}` : ""),
        ...(mode === "fix" && fct.replacement ? { replacement: fct.replacement } : {}) }];
    }
    return [];
  }
  panel.querySelector("#ck-apply").addEventListener("click", async () => {
    const items = [...st.picked].flatMap(([id, mode]) => itemsOf(id, mode));
    if (!items.length) return;
    const go = panel.querySelector("#ck-apply"); go.disabled = true;
    try {
      if (!(await saveEditorFirst(say))) { go.disabled = false; return; }
      say("Putting it into the document…");
      const r = await api("/api/check/apply", { method: "POST", body: JSON.stringify({ file_id: cur.file_id, items }) });
      toast(r.summary + (r.skipped?.length ? ` ${r.skipped.length} couldn't be placed (the text changed).` : ""));
      try { sessionStorage.setItem("aice-checks", "1"); } catch {}
      const app = ((frame().getAttribute("src") || "").match(/\/editor\/(\w+)\//) || [])[1];
      nav("/app/file/" + encodeURIComponent(r.file_id) + (app ? `/edit/${app}` : ""));
    } catch (err) { say(err.message); go.disabled = false; }
  }, { signal: ac.signal });
  panel.querySelector(".ck-list").addEventListener("click", async e => {
    const b = e.target.closest("button"); if (!b) return;
    const card = b.closest("[data-id]"), id = card?.dataset.id;
    if (b.classList.contains("ck-find")) {
      try { await navigator.clipboard.writeText(b.dataset.q); toast("Copied — press Ctrl+F in the editor and paste to find it"); }
      catch { toast("Press Ctrl+F in the editor and search for: " + b.dataset.q.slice(0, 60)); }
      return;
    }
    const act = b.dataset.act; if (!act || !id) return;
    if (act === "dismiss") { st.dismissed.add(id); st.picked.delete(id); }
    else if (act === "bind") return bindLive(id, b);
    else if (st.picked.get(id) === act) st.picked.delete(id);
    else st.picked.set(id, act);
    draw();
  }, { signal: ac.signal });

  // ---- élő adatok ----
  async function loadLive() {
    try { st.live = await api(`/api/live?file_id=${encodeURIComponent(cur.file_id)}`); } catch (err) { st.live = { bindings: [], error: err.message }; }
    draw();
  }
  async function bindLive(id, b) {
    const fct = (st.facts?.claims || []).find(x => x.id === id); if (!fct?.source?.spec) return;
    b.disabled = true;
    try {
      if (!(await saveEditorFirst(say))) { b.disabled = false; return; }
      say("Linking the number to its source…");
      const r = await api("/api/live/bind", { method: "POST", body: JSON.stringify({ file_id: cur.file_id, quote: fct.quote, paragraph: fct.paragraph,
        spec: fct.source.spec, claim: fct.claim }) });
      toast(r.summary);
      try { sessionStorage.setItem("aice-checks", "1"); sessionStorage.setItem("aice-checks-tab", "live"); } catch {}
      const app = ((frame().getAttribute("src") || "").match(/\/editor\/(\w+)\//) || [])[1];
      nav("/app/file/" + encodeURIComponent(r.file_id) + (app ? `/edit/${app}` : ""));
    } catch (err) { say(err.message); b.disabled = false; }
  }
  async function refreshLive() {
    if (st.busy) return; st.busy = true; drawBar();
    try {
      if (!(await saveEditorFirst(say))) { st.busy = false; drawBar(); return; }
      const job = await api("/api/live/refresh", { method: "POST", body: JSON.stringify({ file_id: cur.file_id }) });
      const r = await pollJob(job, j => j.stage === "adjusting the wording" ? "Adjusting the sentences around the new numbers…" : "Getting the newest figures…", panel.querySelector(".ck-status"));
      if (!r.file_id) { st.live = r; say(r.summary); st.busy = false; draw(); return; }
      toast(r.summary);
      try { sessionStorage.setItem("aice-checks", "1"); sessionStorage.setItem("aice-checks-tab", "live"); } catch {}
      const app = ((frame().getAttribute("src") || "").match(/\/editor\/(\w+)\//) || [])[1];
      nav("/app/file/" + encodeURIComponent(r.file_id) + (app ? `/edit/${app}` : ""));
    } catch (err) { say(err.message); st.busy = false; drawBar(); }
  }

  // ---- rajzolás ----
  const q = (text, paragraph) => `<div class="ck-q"><q>${esc(text)}</q><button type="button" class="ck-find" data-q="${esc(text)}">Find</button></div>`;
  const acts = (id, { fix = false, bind = false } = {}) => `<div class="ck-act">
      <button type="button" data-act="comment" aria-pressed="${st.picked.get(id) === "comment"}">Comment</button>
      ${fix ? `<button type="button" data-act="fix" aria-pressed="${st.picked.get(id) === "fix"}" title="Suggest the fix as a tracked change you can accept or reject">Fix</button>` : ""}
      ${bind ? `<button type="button" data-act="bind" title="Link this number to its source — Refresh updates it later">Keep it up to date</button>` : ""}
      <button type="button" data-act="dismiss">Dismiss</button></div>`;
  function drawBar() {
    const bar = panel.querySelector(".ck-bar");
    if (st.tab === "consistency") bar.innerHTML = `<button type="button" class="btn" id="ck-run" ${st.busy ? "disabled" : ""}>Check now</button>
      <label title="After a pause in typing, check your latest edits (about once a minute at most)"><input type="checkbox" id="ck-watch" ${watch ? "checked" : ""}> Watch while I write</label>`;
    else if (st.tab === "facts") bar.innerHTML = `<button type="button" class="btn" id="ck-facts" ${st.busy ? "disabled" : ""}>Check facts</button>
      <span class="muted small">Statistics, exchange rates${st.facts?.web === false ? "" : " and other facts against sources"} · 1 credit per ${10} new facts</span>`;
    else bar.innerHTML = `<button type="button" class="btn" id="ck-refresh" ${st.busy || !(st.live?.bindings || []).length ? "disabled" : ""}>Refresh all</button>
      <span class="muted small">Numbers linked to their source update in one go</span>`;
    bar.querySelector("#ck-run")?.addEventListener("click", () => runCheck(false));
    bar.querySelector("#ck-facts")?.addEventListener("click", () => runCheck(true));
    bar.querySelector("#ck-refresh")?.addEventListener("click", refreshLive);
    bar.querySelector("#ck-watch")?.addEventListener("change", e => {
      watch = e.target.checked; try { localStorage.setItem(CK_WATCH, watch ? "1" : ""); } catch {}
      say(watch ? (inEditor() ? "Watching — your edits are checked after a pause in typing." : "Watching starts when you edit the document.") : "");
    });
  }
  function draw() {
    for (const b of panel.querySelectorAll(".ck-tabs [data-tab]")) b.setAttribute("aria-selected", String(b.dataset.tab === st.tab));
    const nc = visible(st.res?.findings).length, bad = visible(st.facts?.claims).filter(c => ["contradicted", "outdated"].includes(c.verdict)).length;
    const nl = (st.live?.bindings || []).length;
    const tabs = panel.querySelectorAll(".ck-n");
    tabs[0].textContent = st.res ? ` ${nc}` : ""; tabs[1].textContent = st.facts ? ` ${bad}` : ""; tabs[2].textContent = st.live ? ` ${nl}` : "";
    badge.hidden = !(nc + bad); badge.textContent = nc + bad;
    drawBar();
    const list = panel.querySelector(".ck-list");
    if (st.tab === "consistency") {
      const fs = visible(st.res?.findings);
      list.innerHTML = !st.res ? `<p class="ck-empty">${st.busy ? "" : "Contradictions between places, sudden changes of tone and the same thing named two ways."}</p>`
        : !fs.length ? `<p class="ck-empty">No contradictions, tone breaks or wording slips found.</p>`
        : fs.map(c => { const [lab, cls] = CK_KIND[c.kind] || [c.kind, ""];
            return `<article class="ck-card${st.picked.has(c.id) ? " picked" : ""}" data-id="${esc(c.id)}"><div class="ck-kind ${cls}">${esc(lab)}</div>
              <p>${esc(c.note)}</p>${c.places.map(p => q(p.quote)).join("")}
              ${c.fix ? `<p class="ck-fix"><b>Fix:</b> “${esc(c.fix.quote)}” → “${esc(c.fix.replacement)}”</p>` : ""}
              ${acts(c.id, { fix: !!c.fix })}</article>`; }).join("");
    } else if (st.tab === "facts") {
      const cs = visible(st.facts?.claims);
      const card = c => { const [lab, cls] = CK_VERDICT[c.verdict] || [c.verdict, ""], s = c.source || {};
        const src = s.type === "web" ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title || s.url)}</a>`
          : s.source_name ? (s.source_url ? `<a href="${esc(s.source_url)}" target="_blank" rel="noopener">${esc(s.source_name)}</a>` : esc(s.source_name)) + (s.period ? ` · ${esc(s.period)}` : "") : "";
        const canBind = !!s.spec && ["contradicted", "outdated", "supported"].includes(c.verdict);
        return `<article class="ck-card${st.picked.has(c.id) ? " picked" : ""}" data-id="${esc(c.id)}"><div class="ck-kind ${cls}">${esc(lab)}</div>
          <p class="ck-claim">${esc(c.claim)}</p>${q(c.quote)}${c.explanation ? `<p>${esc(c.explanation)}</p>` : ""}
          ${src ? `<p class="ck-src">Source: ${src}</p>` : ""}
          ${c.replacement ? `<p class="ck-fix"><b>Fix:</b> “${esc(c.replacement)}”</p>` : ""}
          ${acts(c.id, { fix: !!c.replacement, bind: canBind })}</article>`; };
      const main = cs.filter(c => c.verdict !== "supported" && c.verdict !== "unverified"), unv = cs.filter(c => c.verdict === "unverified"), ok = cs.filter(c => c.verdict === "supported");
      list.innerHTML = !st.facts ? `<p class="ck-empty">${st.busy ? "" : "Numbers, dates and named facts, each checked against a source — the source is shown with every result. A fact without a source is “not settled”, never “wrong”."}</p>`
        : !cs.length ? `<p class="ck-empty">No checkable facts found.</p>`
        : (main.length ? main.map(card).join("") : `<p class="ck-empty">Nothing wrong or outdated found.</p>`)
          + (unv.length ? `<details class="ck-more"><summary>${unv.length} not settled — no source said yes or no</summary>${unv.map(card).join("")}</details>` : "")
          + (ok.length ? `<details class="ck-more"><summary>${ok.length} confirmed by a source</summary>${ok.map(card).join("")}</details>` : "");
    } else {
      const bs = st.live?.bindings || [];
      list.innerHTML = !st.live ? "" : st.live.error ? `<p class="ck-empty">${esc(st.live.error)}</p>`
        : !bs.length ? `<p class="ck-empty">No live numbers yet. On the Facts tab, “Keep it up to date” links a statistic or an exchange rate to its source; Refresh all then updates every linked number and the words around it, as tracked changes.</p>`
        : bs.map(b => `<article class="ck-card ck-live"><div class="ck-kind ${b.up_to_date ? "ok" : "warn"}">${esc(b.label || "Live number")}</div>
            <p>In the document <b class="ck-val">${esc(b.text || "—")}</b>${b.up_to_date ? " · up to date" : ` · newest <b class="ck-val">${esc(b.display || "")}</b>`}</p>
            <p class="ck-src">${b.source_url ? `<a href="${esc(b.source_url)}" target="_blank" rel="noopener">${esc(b.source_name || "Source")}</a>` : esc(b.source_name || "")}${b.period ? ` · ${esc(b.period)}` : ""}${b.checked_at ? ` · checked ${esc(ago(Date.parse(b.checked_at) / 1000))}` : ""}</p></article>`).join("");
    }
    const n = st.picked.size, go = panel.querySelector("#ck-apply");
    go.disabled = !n || st.busy;
    go.textContent = n ? `Put ${n} into the document` : "Put into the document";
    panel.querySelector("#ck-picked").textContent = n ? "as comments · fixes as tracked changes" : "Pick Comment or Fix on a result";
  }
  draw();
  let again = ""; try { again = sessionStorage.getItem("aice-checks") || ""; sessionStorage.removeItem("aice-checks");
    st.tab = sessionStorage.getItem("aice-checks-tab") || st.tab; sessionStorage.removeItem("aice-checks-tab"); } catch {}
  if (again) { open(true); if (st.tab === "live") loadLive(); }
}

// ---------- ágak és összefésülés (10-14): ugyanabból a változatból több irány, gondolatonként összefésülve ----------
async function drawBranches(f) {
  const box = $("#branches");
  let t; try { t = await api(`/api/branches?file_id=${encodeURIComponent(f.file_id)}`); } catch { return; }
  if (!box.isConnected || (t.heads || []).length < 2) { box.hidden = true; return; }
  const mine = t.nodes.find(n => n.file_id === f.file_id);
  const headOf = id => { const by = Object.fromEntries(t.nodes.map(n => [n.file_id, n])); let x = by[id];
    while (x && x.children.length) x = by[x.children[x.children.length - 1]]; return x?.file_id; };
  const myHead = headOf(f.file_id);
  box.hidden = false;
  box.innerHTML = `<span class="muted small">Branches</span>` + t.heads.map(h =>
    `<a href="/app/file/${encodeURIComponent(h.file_id)}" class="br-chip" ${h.file_id === myHead ? 'aria-current="true"' : ""} title="${esc(h.label)}">${esc(h.branch)}</a>`).join("")
    + `<button type="button" class="btn ghost br-merge" id="br-merge">Compare &amp; merge</button>`;
  $("#br-merge").addEventListener("click", () => openMerge(t, myHead || f.file_id));
}
function openMerge(t, a) {
  const dlg = $("#merge-dlg"), body = $("#merge-body");
  const heads = t.heads, other = (heads.find(h => h.file_id !== a) || heads[0]).file_id;
  const opt = sel => heads.map(h => `<option value="${esc(h.file_id)}" ${h.file_id === sel ? "selected" : ""}>${esc(h.branch)} — ${esc(h.label)}</option>`).join("");
  body.innerHTML = `<h2 id="merge-title">Merge branches</h2>
    <div class="mg-pick"><label>A <select id="mg-a">${opt(a)}</select></label><label>B <select id="mg-b">${opt(other)}</select></label>
      <button type="button" class="btn" id="mg-compare">Compare</button></div>
    <p class="muted small" id="mg-status" role="status" aria-live="polite"></p><div id="mg-units"></div>
    <div class="mg-foot" hidden><input id="mg-how" autocomplete="off" placeholder="Or say how to combine them — e.g. keep A's opening, add B's data">
      <button type="button" class="btn primary" id="mg-go">Merge <em class="ai-badge">AI</em></button></div>`;
  let plan = null;
  const compare = async () => {
    const A = $("#mg-a").value, B = $("#mg-b").value;
    if (A === B) { $("#mg-status").textContent = "Choose two different branches."; return; }
    $("#mg-units").innerHTML = ""; body.querySelector(".mg-foot").hidden = true;
    try {
      const job = await api("/api/branches/compare", { method: "POST", body: JSON.stringify({ a: A, b: B }) });
      plan = await pollJob(job, () => "Pairing up the ideas of the two branches…", $("#mg-status"));
    } catch (err) { $("#mg-status").textContent = err.message; return; }
    $("#mg-status").textContent = plan.summary + " Pick per place — or just say how to combine them.";
    const txt = xs => xs.length ? xs.map(x => `<p>${esc(x.text)}</p>`).join("") : `<p class="muted">— nothing here —</p>`;
    $("#mg-units").innerHTML = plan.units.map(u => `<section class="mg-unit" data-id="${esc(u.id)}">
        <div class="mg-topic">${esc(u.topic || (u.kind === "only_b" ? "Only in B" : u.kind === "only_a" ? "Only in A" : "Changed"))}</div>
        <div class="mg-cols"><div><span class="mg-tag">A</span>${txt(u.a)}</div><div><span class="mg-tag">B</span>${txt(u.b)}</div></div>
        <div class="mg-choice" role="radiogroup" aria-label="Keep">${[["", "Let the AI decide"], ["a", "A"], ["b", "B"], ["both", "Both"], ["merge", "Write from both"]]
          .map(([v, l]) => `<label><input type="radio" name="mg-${esc(u.id)}" value="${v}" ${v === "" ? "checked" : ""}> ${l}</label>`).join("")}</div></section>`).join("");
    body.querySelector(".mg-foot").hidden = false;
  };
  $("#mg-compare").addEventListener("click", compare);
  $("#mg-go").addEventListener("click", async () => {
    if (!plan) return;
    const choices = {}; for (const u of plan.units) { const v = body.querySelector(`input[name="mg-${CSS.escape(u.id)}"]:checked`)?.value; if (v) choices[u.id] = v; }
    const instruction = $("#mg-how").value.trim();
    if (!instruction && Object.keys(choices).length < plan.units.length) {
      $("#mg-status").textContent = "Pick A, B or Both for every place — or say how to combine them below."; return; }
    const go = $("#mg-go"); go.disabled = true;
    try {
      if (!(await saveEditorFirst(m => $("#mg-status").textContent = m))) { go.disabled = false; return; }
      const job = await api("/api/branches/merge", { method: "POST", body: JSON.stringify({ a: plan.a, b: plan.b, choices, instruction }) });
      const r = await pollJob(job, j => j.stage === "writing the merged parts" ? "Writing the merged parts…" : j.stage === "deciding place by place" ? "Deciding place by place…" : "Merging…", $("#mg-status"));
      dlg.close(); toast(r.summary + " Accept or reject each change in the editor.");
      nav("/app/file/" + encodeURIComponent(r.file_id) + "/edit/wordcraft");
    } catch (err) { $("#mg-status").textContent = err.message; go.disabled = false; }
  });
  $("#merge-x").onclick = () => dlg.close();
  if (!dlg.open) dlg.showModal();
  compare();
}

// kitöltő űrlap a PDF saját mezőiből (név → címke: a mezőnévből olvasható alak)
function openFill(f, fields) {
  // a nyomtatott felirat (a mező tooltipje, ékezetekkel) — ha nincs, a mezőnévből
  const label = fd => (fd.tooltip || "").replace(/[:\s]+$/, "") || fd.name.replace(/_/g, " ").replace(/^./, c => c.toUpperCase());
  const input = fd => {
    const id = `fv-${fd.name}`;
    if (fd.type === "checkbox") return `<label class="checks" style="margin:0 0 10px"><span><input type="checkbox" name="${esc(fd.name)}" ${fd.value && fd.value !== "Off" ? "checked" : ""}> ${esc(label(fd))}</span></label>`;
    if ((fd.type === "combo" || fd.type === "list" || fd.type === "radio") && fd.options?.length)
      return `<label>${esc(label(fd))}<select name="${esc(fd.name)}"><option value=""></option>${fd.options.map(o => `<option ${o === fd.value ? "selected" : ""}>${esc(o)}</option>`).join("")}</select></label>`;
    return `<label for="${esc(id)}">${esc(label(fd))}<input id="${esc(id)}" type="text" name="${esc(fd.name)}" value="${esc(fd.value || "")}"></label>`;
  };
  MAKERS.fill = {
    cta: "Fill in", title: "Fill in the form", sub: `${fields.length} fields. You get a new PDF; this one stays blank.`,
    fields: () => fields.filter(fd => fd.type !== "button" && fd.type !== "signature" && !fd.read_only).map(input).join("") +
      `<details style="margin:6px 0 14px"><summary style="cursor:pointer;font-weight:600;font-size:13px">Or fill many copies from a spreadsheet</summary>
       <p class="muted small" style="margin:8px 0">CSV or Excel: first row = field names (${esc(fields.slice(0, 4).map(x => x.name).join(", "))}…), one copy per row, all in one PDF.</p>
       <input type="file" name="sheet" accept=".csv,.tsv,.xlsx"></details>
       <label class="checks" style="margin:0 0 6px"><span><input type="checkbox" name="__flat"> Print-ready — the answers can't be changed afterwards</span></label>`,
    wire() {},
    async submit(fd, form) {
      const sheet = form.querySelector("[name=sheet]").files[0], flatten = !!fd.get("__flat");
      if (sheet) {
        const d = await uploadFile(sheet);
        $("#make-status").textContent = "Filling one copy per row…";
        return api("/api/make/fill_form", { method: "POST", body: JSON.stringify({ file_id: f.file_id, data_file_id: d.file_id, flatten }) });
      }
      const values = {};
      for (const fdx of fields) {
        const el = form.querySelector(`[name="${CSS.escape(fdx.name)}"]`); if (!el) continue;
        values[fdx.name] = el.type === "checkbox" ? el.checked : el.value;
      }
      return api("/api/make/fill_form", { method: "POST", body: JSON.stringify({ file_id: f.file_id, values, flatten }) });
    },
  };
  openMaker("fill");
}
const t0 = tpl => tpl === "certificate" ? "Recipient name" : "Your title here";   // helyőrző, ha a szerkesztőben írja be
// a fiók kitöltése: mentés sikeres készítéskor, visszatöltés, ha a felhasználó visszajön (fájlt a böngésző nem enged)
function formState(form) {
  return { hadFiles: [...form.querySelectorAll("input[type=file]")].some(i => i.files.length),
    values: [...form.elements].filter(e => e.name && e.type !== "file" && e.tagName !== "BUTTON").map(e => [e.name, e.type, e.value, e.checked]) };
}
function restoreForm(form, st) {
  for (const [name, type, value, checked] of st.values || []) {
    form.querySelectorAll(`[name="${CSS.escape(name)}"]`).forEach(e => {
      if (type === "radio" || type === "checkbox") { if (e.value === value) e.checked = checked; }
      else if (e.type === type) e.value = value;
    });
  }
  form.querySelectorAll("input[type=radio]:checked, input[type=checkbox], select").forEach(e => e.dispatchEvent(new Event("change", { bubbles: true })));
  $("#make-status").textContent = "Your last settings are filled in — change what you like and make it again." + (st.hadFiles ? " Pick the files again." : "");
}
// ZSÁKUTCA NINCS: minden gomb visz valahova. Üres szövegmező → a helyőrző példája; vendég AI-n → fiók-ajánlat;
// hiányzó fájl → a választó nyílik, és a kiválasztás után magától folytatja (readSlot + openMaker).
function example(form, name) {
  const el = form.querySelector(`[name=${name}]`);
  el.value = (el.placeholder || "").replace(/^e\.g\.\s*/i, "").trim();
  return el.value;
}
const needAccount = () => Object.assign(new Error(AI_NOTE), { cta: true });
// social/print: a natív (VectorCraft) dizájnfájl a dizájn-szerkesztőben nyílik (a PNG/PDF mellette a fájlok közt)
function editNative(list, n) {
  const nat = (list || []).find(f => f.file_id.endsWith(".vectorcraft")) || list[0];
  return { file_id: nat.file_id, n, edit: true, msg: "Opening the design editor…" };
}
function openMaker(kind, opts = {}) {
  const m = MAKERS[kind], form = $("#make-form");
  if (account?.guest && AI_MAKERS.has(kind)) { pendingPreset = null; return accountCta(m.title, m.guestAlt || ""); }
  form.innerHTML = `<nav class="tool-switch" aria-label="Tools">${Object.keys(SLUGS).map(k => {
      const name = esc(MAKERS[k].title.replace(/^New /, "").replace(/^./, c => c.toUpperCase()));
      return k === kind ? `<span aria-current="page">${name}</span>` : `<button type="button" data-switch="${k}">${name}</button>`; }).join("")}</nav>
    <h2 id="drawer-title">${m.title}</h2><p class="muted" style="margin:0 0 20px">${m.sub}</p>${m.fields()}
    <p class="status" id="make-status"></p>
    <div class="actions"><button class="btn ghost" value="cancel" formnovalidate>Cancel</button>${m.alt ? `<button class="btn" id="make-alt" value="alt"${m.altLoose ? " formnovalidate" : ""}>${m.alt}</button>` : ""}<button class="btn primary" id="make-go" value="go">Make it</button></div>`;
  setTitle(m.title);
  // a fő gomb felirata a módhoz/munkához igazodik („Start writing”, „Merge them”, „Restore”…)
  const label = () => { const go = form.querySelector("#make-go"); if (go && !go.disabled) go.textContent = typeof m.cta === "function" ? m.cta(form) : (m.cta || "Make it"); };
  form.addEventListener("change", label);
  form.addEventListener("input", label);         // gépelés közben is (pl. Video: üres mező → „Open an empty timeline”)
  form.addEventListener("slotchange", label);    // fájl érkezett / kikerült
  m.wire?.(form, opts);
  wireSlots(form);
  form.querySelector(".tool-switch").addEventListener("click", e => { const b = e.target.closest("[data-switch]"); if (b) switchTool(kind, b.dataset.switch, form); });
  const back = opts.again || opts.draft;
  if (back) {   // visszatérés: a beírt adatok + a fájlok (ugyanabban a munkamenetben a feltöltendők is)
    let st = drafts[kind];
    if (!st) { try { st = JSON.parse(sessionStorage.getItem("aice-mk:" + kind) || "null"); } catch {} }
    if (st) {
      restoreForm(form, st); restoreSlots(form, st.slots);
      $("#make-status").textContent = (opts.draft ? "Your unfinished settings are back." : "Your last settings are filled in — change what you like and make it again.")
        + (st.hadFiles && !st.slots ? " Pick the files again." : "");
    }
  }
  const [field, words] = MODES[kind] || [];
  if (field) {
    if (opts.mode && !back) { const r = form.querySelector(`[name=${field}][value=${opts.mode}]`); if (r) { r.checked = true; r.dispatchEvent(new Event("change", { bubbles: true })); } }
    form.querySelectorAll(`[name=${field}]`).forEach(r => r.addEventListener("change", () => {
      if (here().startsWith("/app/make/")) history.replaceState(null, "", makeLink(kind, r.value, opts.source));
    }));
  }
  if (!back) {
    if (opts.source) { const tk = (opts.slot && (TAKES[kind] || []).find(([s]) => s === opts.slot)) || takesFor(kind, extOf(opts.source)); if (tk) presetSlot(form, tk[0], [opts.source]); }
    applyCarry(kind, form);
    applyPreset(kind, form);
  }
  label();
  form.onsubmit = async e => {
    if (!["go", "alt"].includes(e.submitter?.value)) return;
    e.preventDefault();
    const go = $("#make-go"), alt = $("#make-alt"); go.disabled = true; if (alt) alt.disabled = true;
    $("#make-status").textContent = "Working on it — this takes a few seconds…";
    try {
      const r = await m.submit(new FormData(form), form, { alt: e.submitter.value === "alt" });
      drafts[kind] = { ...formState(form), slots: slotSnapshot(form) };
      try {   // a Vissza (vagy a „Back to …” gomb) ide hoz vissza, a beírt adatokkal
        sessionStorage.setItem("aice-mk:" + kind, JSON.stringify(formState(form)));
        sessionStorage.setItem("aice-made:" + r.file_id, JSON.stringify({ kind, link: here().startsWith("/app/make/") ? here().replace(/[?&]again=1/, "") : makeLink(kind) }));
      } catch {}
      if (here().startsWith("/app/make/")) history.replaceState({ again: true }, "", here());
      keepMakeLink = true;
      $("#drawer").close(); await loadAccount();
      // ELV: minden készítő a LÁTHATÓ szerkesztőbe visz, ha az eredmény típusára van szerkesztő (kivéve: edit:false)
      const ed = editorsFor(extOf(r.file_id))[0], edit = r.edit ?? !!ed;
      const more = r.n > 2 ? ` — the other ${r.n - 1} files are in your workspace` : r.n > 1 ? " — the other file is in your workspace too" : "";
      toast(r.msg || (edit && ed ? `Opening the ${EDITOR_NAMES[ed[0]]}…${more}` : r.n > 1 ? `Done — ${r.n} files are in your workspace` : "Done"));
      nav("/app/file/" + encodeURIComponent(r.file_id) + (edit && ed ? "/edit" : ""));
    } catch (err) {
      go.disabled = false; if (alt) alt.disabled = false;
      if (err.cta) return accountCta(m.title);                 // vendég AI-n: a fiók-ajánlat (nem zsákutca)
      $("#make-status").textContent = err.message;
      if (err.slot) {                                          // hiányzó fájl: amint kiválasztja, magától folytatja
        const s = slotEl(form, err.slot), sub = e.submitter.value;
        const resume = () => {
          if (slotPicked(form, err.slot).length + s.querySelector("input[type=file]").files.length < (err.min || 1)) return;
          s.removeEventListener("slotchange", resume);
          form.requestSubmit(sub === "alt" ? $("#make-alt") : $("#make-go"));
        };
        s.addEventListener("slotchange", resume);
      }
    }
  };
  if (!$("#drawer").open) $("#drawer").showModal();
  form.scrollTop = 0; $("#drawer").scrollTop = 0;
}

$("#drawer-x").addEventListener("click", () => $("#drawer").close());
let invalidShown = false;
$("#make-form").addEventListener("pointerdown", e => { if (e.target.closest(".actions")) invalidShown = false; }, true);
$("#make-form").addEventListener("keydown", e => { if (e.key === "Enter") invalidShown = false; }, true);
$("#make-form").addEventListener("invalid", e => {      // a böngésző buborékja gyorsan eltűnik — legyen jól látható
  const el = e.target;
  el.classList.add("needs");
  el.addEventListener("input", () => el.classList.remove("needs"), { once: true });
  el.addEventListener("change", () => el.classList.remove("needs"), { once: true });
  if (invalidShown) return;
  invalidShown = true;
  const lab = el.closest("label"), name = lab ? (lab.firstChild?.textContent || "").trim() : "";
  $("#make-status").textContent = name ? `Fill in “${name}” first.` : "Fill in the highlighted field first.";
  el.scrollIntoView({ block: "center", behavior: "smooth" });
}, true);
let keepMakeLink = false;   // sikeres készítés után a fiók linkje marad az előzményekben (a Vissza oda hoz)
$("#drawer").addEventListener("close", () => {
  if (keepMakeLink) { keepMakeLink = false; return; }
  if (here().startsWith("/app/make/")) { history.replaceState(null, "", underMaker); setTitle(baseTitle); markNav(); }
});
$("#drawer").addEventListener("click", e => {          // kattintás a fiók mellé (a sötét háttérre) = bezárás
  if (e.target === e.currentTarget && e.clientX < e.currentTarget.getBoundingClientRect().left) e.currentTarget.close();
});
// a munkaterület magassága a fejléc valódi magasságából (telefonon két sor) — különben az alsó sáv kilóg
const setTop = () => document.documentElement.style.setProperty("--top", $(".topbar").offsetHeight + "px");
addEventListener("resize", setTop); setTop();
loadAccount().catch(() => {}); route();
