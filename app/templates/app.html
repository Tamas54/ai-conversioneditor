<body>
<header class="topbar">
  <a class="brand" href="#/">{{PRODUCT}}</a>
  <nav aria-label="Main">

<main id="view"></main>

<dialog class="drawer" id="drawer" aria-labelledby="drawer-title"><button type="button" class="x-close drawer-x" id="drawer-x" aria-label="Close" title="Close (Esc)">✕</button><form id="make-form" method="dialog"></form></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<template id="t-home">
  <section class="mat"><div class="ruler-nums" aria-hidden="true"></div><div class="mat-inner">
    <h1>What are we making?</h1>
    <p class="lede">Pick a tool, answer a few questions, get a finished file. Fix anything by hand in the built-in editors — or let your own AI drive it.</p>
    <div class="tools">
      <button class="tool" data-make="doc"><span class="obj"><span class="paper o-doc"><i></i><i></i><i></i><i></i><i></i><i></i></span></span>
        <span class="label">Document</span><span class="hint">Write or edit like in Word — letters, reports, CVs; start blank or from a brief</span></button>
      <button class="tool" data-make="deck"><span class="obj"><span class="paper o-deck"><i></i><i></i><i></i><b></b></span></span>
        <span class="label">Presentation <em class="ai-badge">AI</em></span><span class="hint">Slides from a short brief, with photos and charts</span></button>
      <button class="tool" data-make="social"><span class="obj"><span class="paper o-post"><div></div><span></span></span></span>
        <span class="label">Social post</span><span class="hint">One design, every platform size at once</span></button>
      <button class="tool" data-make="print"><span class="obj"><span class="paper o-poster">Big<br>idea.</span></span>
        <span class="label">Print design</span><span class="hint">Posters, flyers, report covers, certificates</span></button>
      <button class="tool" data-make="photo"><span class="obj"><span class="paper o-photo"><div></div></span></span>
        <span class="label">Photos</span><span class="hint">Edit with words, restore old family photos, cut out</span></button>
      <button class="tool" data-make="book"><span class="obj"><span class="o-book paper"><i></i><i></i></span></span>
        <span class="label">Book</span><span class="hint">Your manuscript as a print-ready book PDF</span></button>
      <button class="tool" data-make="scan"><span class="obj"><span class="o-scan"><span class="paper"><i></i><i></i><i></i><i></i><i></i></span></span></span>
        <span class="label">Scan to text <em class="ai-badge">AI</em></span><span class="hint">Old books and photographed pages → Word, a new PDF, searchable PDF</span></button>
      <button class="tool" data-make="pdf"><span class="obj"><span class="paper o-pdf"><i></i><i></i><i class="x"></i><i></i><i></i><b>PDF</b></span></span>
        <span class="label">PDF tools</span><span class="hint">Merge, compress, black out, number, protect, to Word</span></button>
      <button class="tool" data-make="convert"><span class="obj"><span class="o-convert"><span class="paper a">DOCX</span><span class="paper b">PDF</span><b>⇄</b></span></span>
        <span class="label">Convert</span><span class="hint">Word, PDF, slides, sheets, images, e-books — any to any</span></button>
    </div>
  </div></section>
  <section class="sheet intro">
    <div class="how">
      <div><b>1</b><h3>Pick a tool, or open a file</h3><p>Upload a manuscript, a scan, a deck, a photo or a PDF — or start from a short brief.</p></div>
      <div><b>2</b><h3>Get a finished file</h3><p>Real Word, PowerPoint, PDF and Photoshop files. Fix anything by hand in the built-in editors.</p></div>
      <div><b>3</b><h3>Ask for changes in plain words</h3><p>Every change is a new version — go back any time. Photos keep every step on its own layer.</p></div>
    </div>
    <h2 class="try-title">Things to try</h2>
    <div class="try">
      <button data-try="photo"><span>Photos</span>“Remove the blurry grass in front of the animal”</button>
      <button data-try="photo"><span>Photos</span>“Put the Parliament behind it, crop to 4:5, headline at the top”</button>
      <button data-try="photo"><span>Photos · restore</span>Photograph a whole album page — every old print is found, repaired and coloured</button>
      <button data-try="scan"><span>Scan to text</span>Phone photos of an old book → Word, a new book PDF, a searchable PDF</button>
      <button data-try="book"><span>Book · then ask</span>“On page 22 add a photo of the Colosseum” · “indent every paragraph after the third”</button>
      <button data-try="deck"><span>Presentation</span>A brief → a designed deck; attach a pptx you like as the style example</button>
      <button data-try="pdf"><span>PDF tools</span>Merge, black out names for good, number the pages, lock with a password</button>
      <button data-try="scan"><span>Forms</span>Photo of a paper form → a fillable PDF; fill one, or a hundred from a spreadsheet</button>
    </div>
    <p class="muted small connect-note">Use it from your own AI too — Claude, ChatGPT, Cursor: <a href="#/connect">Connect your AI</a>. Without an account you can try everything that doesn't use AI.</p>
  </section>
  <section class="sheet">
    <div class="row-head"><h2>Recent</h2><a class="small" href="#/files">All files</a></div>
    <div class="files" id="recent"></div>
  </section>
</template>

      <label class="btn" style="margin:0">Upload<input type="file" id="upload" hidden></label></div>

      <div id="key-new" hidden style="margin-top:16px">
        <p class="small"><strong>Copy it now</strong> — the key is shown only once.</p>
        <div class="keybox" id="key-url"></div>

      <ul class="keys" id="keys"></ul>

<template id="t-plans">
  <section class="sheet plans">
    <div class="row-head"><h2>Plans</h2><div class="seg" id="interval"><label><input type="radio" name="iv" value="month" checked><span>Monthly</span></label><label><input type="radio" name="iv" value="year"><span>Yearly · 2 months free</span></label></div></div>
    <p class="muted" id="plan-now"></p>
    <div class="plan-cards" id="plan-cards"></div>
    <h3 class="plans-h">Credit packs <span class="muted small">— no subscription, they don't expire</span></h3>
    <div class="packs" id="packs"></div>
    <div class="plans-grid2">
      <div><h3 class="plans-h">What costs credits</h3><table class="costs" id="costs"></table>
        <p class="muted small">Everything else — documents, decks, scans within your monthly pages, changes, PDF tools, conversions, editors — is included in your plan.</p></div>
      <div id="usage-box" hidden><h3 class="plans-h">This month</h3><div id="usage"></div></div>
    </div>
    <p class="muted small" id="manage"></p>
  </section>
</template>

<template id="t-file">
  <section class="work">
    <div class="work-bar">
      <a class="btn ghost" id="btn-back" href="#/files" aria-label="Back">←</a>
      <h2 id="file-name"></h2>
      <span id="edit-btns"></span>
      <span class="convert-to" id="convert-to" hidden><select id="convert-fmt" aria-label="Convert to"></select><button class="btn ghost" id="btn-convert">Convert</button></span>
      <a class="btn" id="btn-download" download>Download</a>
      <button class="btn" id="btn-print">Print</button>
      <button class="btn ghost" id="btn-delete">Delete</button>
      <a class="btn ghost x-close" id="btn-close" href="#/files" aria-label="Close" title="Close">✕</a>
    </div>
    <iframe id="file-frame" title="File preview" allow="clipboard-read; clipboard-write; fullscreen"></iframe>
    <form class="revise" id="revise" hidden>
      <ol class="versions" id="versions" aria-label="Versions"></ol>
      <div class="rev-row">
        <input id="rev-input" autocomplete="off" placeholder="Ask for a change — e.g. “on page 22 add a photo of the Colosseum”, “remove the grass in front of the animal”">
        <label class="btn ghost rev-style" title="Attach a style example: a Word file, pptx/template, PDF or picture whose look you want"><span id="rev-style-name">Style example</span><input type="file" id="rev-style" hidden accept=".pptx,.potx,.pdf,.docx,.odt,.rtf,image/*"></label>
        <button class="btn primary" id="rev-go">Apply <em class="ai-badge">AI</em></button>
      </div>
      <p class="status small" id="rev-status"></p>
    </form>
  </section>
</template>

<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
// [szerkesztő, gomb-felirat, formátumok] — egy formátumnál az első találat az elsődleges (pl. PDF: PDF-szerkesztő, aztán dizájn)
const EDITORS = [
  ["wordcraft", "Edit document", ["docx","doc","odt","rtf","md","html","htm","txt","tex"]],
  ["deckcraft", "Edit slides", ["pptx","deckcraft"]],
  ["pdfcraft", "Edit PDF", ["pdf"]],
  ["gridcraft", "Edit sheet", ["xlsx","csv","tsv"]],
  ["photocraft", "Edit image", ["png","jpg","jpeg","webp","psd","psb","tif","tiff","bmp","gif","exr","pcraft"]],
  ["designcraft", "Edit layout", ["designcraft","idml"]],
  ["vectorcraft", "Edit as design", ["svg","svgz","pdf","ai","eps","vectorcraft"]],
];
const editorsFor = ext => EDITORS.filter(([, , exts]) => exts.includes((ext || "").toLowerCase()));
let account = null, files = [];

function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 3800); }
async function api(path, opts = {}) {
  const r = await fetch(path, { headers: opts.body && !(opts.body instanceof FormData) ? { "Content-Type": "application/json" } : {}, ...opts });
  if (r.status === 401) { location.href = "/login?next=" + encodeURIComponent("/app" + location.hash); throw new Error("signed out"); }
  const data = r.headers.get("content-type")?.includes("json") ? await r.json() : await r.text();
  if (!r.ok) throw new Error((data && data.detail) || data.error || `Request failed (${r.status})`);
  return data;
}

// ---------- fiók ----------
async function loadAccount() {
  account = await api("/api/account");
  $("#credits").textContent = account.credits === null ? "credits ∞" : `${account.credits} credits`;
  for (const [id, show] of [["credits", !account.guest], ["signout", !account.guest], ["signin", account.guest], ["signup", account.guest]])
    $("#" + id).hidden = !show;
  document.body.classList.toggle("guest", !!account.guest);
}
const AI_NOTE = "This uses AI — create a free account to use it.";
const AI_MAKERS = new Set(["scan"]);
const SLUGS = { doc: "document", deck: "presentation", social: "social-post", print: "print-design", photo: "photos",
  book: "book", scan: "scan-to-text", pdf: "pdf-tools", convert: "convert" };
const MODES = {   // eszköz → [mód-mező, {érték: link-szó}]
  doc: ["dmode", { template: "new", brief: "from-brief", open: "open" }],
  deck: ["pmode", { blank: "new", brief: "from-brief", document: "from-document", open: "open" }],
  photo: ["mode", { edit: "edit", restore: "restore", quick: "quick-fix", open: "open" }],
};
const makeLink = (kind, mode, src) => `#/make/${SLUGS[kind]}` + (mode && MODES[kind] ? `/${MODES[kind][1][mode]}` : "") + (src ? `?src=${encodeURIComponent(src)}` : "");       // a Presentationnek van AI nélküli módja (New / Open a file)
function accountCta(title) {
  const form = $("#make-form");
  form.innerHTML = `<h2 id="drawer-title">${esc(title)}</h2>
    <p class="muted" style="margin:0 0 18px">This tool uses AI, so it needs an account. Creating one takes a minute; anything you made as a guest comes with you.</p>
    <div class="actions"><button class="btn ghost" value="cancel" formnovalidate>Not now</button><a class="btn primary" href="/signup?next=/app">Create free account</a></div>`;
  form.onsubmit = null; $("#drawer").showModal();
}
// hosszú munka (job) követése: a státuszsort frissíti, a végén az eredményt adja
async function pollJob(job, label, st = $("#make-status")) {
  while (job.status === "running") {
    if (st) st.textContent = label(job);
    await new Promise(r => setTimeout(r, 2000));
    job = await api(`/api/jobs/${job.id}`);
  }
  if (job.status !== "done") throw new Error(job.error || "Something went wrong — try again.");
  return job.result;
}

// ---------- fájlok ----------
async function loadFiles() {
  const d = await api("/api/files");
  files = [...(d.inputs || []), ...(d.outputs || [])].sort((a, b) => b.mtime - a.mtime);
}
const IMG = ["png","jpg","jpeg","webp","gif","bmp"];
const REL = new Intl.RelativeTimeFormat("en", { numeric: "auto", style: "short" });
function ago(ts) {
  const s = Date.now() / 1000 - ts;
  if (s < 60) return "just now";
  for (const [unit, n] of [["minute", 60], ["hour", 3600], ["day", 86400]])
    if (s < n * (unit === "day" ? 7 : unit === "hour" ? 24 : 60)) return REL.format(-Math.floor(s / n), unit);
  return new Date(ts * 1000).toLocaleDateString("en", { day: "numeric", month: "short", year: "numeric" });
}
const size = kb => kb < 1 ? "<1 kB" : kb < 1024 ? `${kb} kB` : `${(kb / 1024).toFixed(1)} MB`;
const ICON_DL = `<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11"/><path d="m7 10 5 5 5-5"/><path d="M5 20h14"/></svg>`;
const ICON_PRINT = `<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 9V3h10v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M7 14h10v7H7z"/></svg>`;
function fileCard(f) {
  return `<div class="file-card"><button class="file" data-id="${esc(f.file_id)}"><span class="thumb" data-ext="${esc(f.ext)}"><img src="/api/thumb/${encodeURIComponent(f.file_id)}" alt="" loading="lazy"${IMG.includes(f.ext) ? "" : ' class="page"'}></span>
    <span class="name" title="${esc(f.label)}">${esc(f.label)}</span><span class="meta">${size(f.size_kb)} · ${ago(f.mtime)}</span></button>
    <span class="file-acts"><a class="fa" href="${esc(f.url)}" download title="Download" aria-label="Download ${esc(f.label)}">${ICON_DL}</a><button class="fa" data-print="${esc(f.file_id)}" title="Print" aria-label="Print ${esc(f.label)}">${ICON_PRINT}</button></span></div>`;
}
// nyomtatás: a szerver PDF-et ad (Word, pptx, táblázat, kép, PSD… → PDF), a böngésző azt nyomtatja
async function printFile(id) {
  toast("Getting it ready to print…");
  try {
    const r = await fetch(`/api/print/${encodeURIComponent(id)}`);
    if (!r.ok) { let m = "Could not print this file."; try { m = (await r.json()).detail || m; } catch {} throw new Error(m); }
    const url = URL.createObjectURL(await r.blob());
    const fr = document.createElement("iframe");
    fr.className = "print-frame"; fr.title = "Print"; fr.src = url;
    fr.onload = () => setTimeout(() => {
      try { fr.contentWindow.focus(); fr.contentWindow.print(); } catch { window.open(url, "_blank"); }
      setTimeout(() => { fr.remove(); URL.revokeObjectURL(url); }, 120000);
    }, 250);
    document.body.append(fr);
  } catch (e) { toast(e.message); }
}
const BANDS = { pptx: "#FF5A36", ppt: "#FF5A36", pdf: "#C2362B", docx: "#2F80ED", doc: "#2F80ED", odt: "#2F80ED",
  xlsx: "#1E9E6A", csv: "#1E9E6A", md: "#5C6870", txt: "#5C6870", svg: "#8E44AD", vectorcraft: "#8E44AD", psd: "#2F5D7C" };
function glyph(ext) {
  const wide = ["pptx", "ppt", "key"].includes(ext);
  return `<span class="glyph${wide ? " wide" : ""}" style="--band:${BANDS[ext] || "#5C6870"}"><i></i><i></i><i></i>${wide ? "" : "<i></i><i></i>"}<b>${esc(ext.toUpperCase())}</b></span>`;
}
function renderFiles(el, list) {
  el.innerHTML = list.length ? list.map(fileCard).join("") : `<div class="empty">Nothing here yet — make something above, or upload a file.</div>`;
  el.querySelectorAll(".file").forEach(b => b.addEventListener("click", () => location.hash = "#/file/" + encodeURIComponent(b.dataset.id)));
  el.querySelectorAll("[data-print]").forEach(b => b.addEventListener("click", () => printFile(b.dataset.print)));
  // nincs bélyegkép (ismeretlen típus, render-hiba) → típus-ikon
  el.querySelectorAll(".thumb img").forEach(img => img.addEventListener("error", () => { const t = img.parentElement; t.innerHTML = glyph(t.dataset.ext); }, { once: true }));
}

// ---------- csomagok ----------
const FEATURES = {
  free: p => [`${p.monthly_credits} credits every month (30 to start)`, `${p.quota.deck} presentations · ${p.quota.revise} changes a month`, `${p.quota.scan_pages} scanned pages a month`, `Up to ${p.batch} photos at once`, `Files kept ${p.retention_days} days`],
  plus: p => [`${p.monthly_credits} credits every month`, "Presentations, documents and changes — as many as you need", `${p.quota.scan_pages.toLocaleString("en")} scanned pages a month`, `Up to ${p.batch} photos at once`, `Files kept ${p.retention_days} days`],
  pro: p => [`${p.monthly_credits} credits every month`, "Everything in Plus, with room for heavy use", `${p.quota.scan_pages.toLocaleString("en")} scanned pages a month`, `Up to ${p.batch} photos at once`, "Use it from Claude, ChatGPT and your scripts (MCP)", `Files kept a year`],
};
async function buy(item, interval) {
  if (account?.guest) { location.href = "/signup?next=/app%23/plans"; return; }
  try { const r = await api("/api/billing/checkout", { method: "POST", body: JSON.stringify({ item, interval }) }); location.href = r.url; }
  catch (e) { toast(e.message); }
}

// ---------- nézetek ----------
const views = {
  async plans(arg) {
    mount("t-plans");
    await loadAccount();
    const P = await api("/api/billing/plans"), cur = account.guest ? null : account.plan, eur = n => `€${n}`;
    if (/paid=1/.test(arg || "")) toast("Thank you! Your plan and credits show up within a few seconds.");
    $("#plan-now").textContent = account.guest ? "You're a guest — create a free account to get 30 credits."
      : `You're on ${account.plan_name}${account.credits === null ? "" : ` with ${account.credits} credits`}.`;
    const draw = () => {
      const iv = document.querySelector("[name=iv]:checked").value;
      $("#plan-cards").innerHTML = ["free", "plus", "pro"].map(k => {
        const p = P.plans[k], price = k === "free" ? "€0" : iv === "year" ? `${eur(p.year)}<small>/year</small>` : `${eur(p.month)}<small>/month</small>`;
        const btn = k === "free" ? (account.guest ? `<a class="btn" href="/signup?next=/app%23/plans">Create free account</a>` : `<span class="muted small">${cur === "free" ? "Your plan" : ""}</span>`)
          : cur === k ? `<span class="badge-cur">Your plan</span>`
          : P.enabled ? `<button class="btn primary" data-buy="${k}">Choose ${p.name}</button>` : `<button class="btn" disabled>Payments open soon</button>`;
        return `<article class="plan${k === "plus" ? " pick" : ""}${cur === k ? " cur" : ""}"><h3>${p.name}</h3><div class="price">${price}</div>
          <ul>${FEATURES[k](p).map(f => `<li>${esc(f)}</li>`).join("")}</ul>${btn}</article>`;
      }).join("");
      $("#plan-cards").querySelectorAll("[data-buy]").forEach(b => b.addEventListener("click", () => buy(b.dataset.buy, iv)));
    };
    document.querySelectorAll("[name=iv]").forEach(r => r.addEventListener("change", draw)); draw();
    $("#packs").innerHTML = Object.entries(P.packs).map(([k, p]) => `<article class="pack"><b>${p.credits}</b> credits<span>${eur(p.price)}</span>
      ${P.enabled ? `<button class="btn" data-pack="${k}">Buy</button>` : `<button class="btn" disabled>Soon</button>`}</article>`).join("");
    $("#packs").querySelectorAll("[data-pack]").forEach(b => b.addEventListener("click", () => buy(b.dataset.pack)));
    const c = P.costs;
    $("#costs").innerHTML = [["AI image, AI background, AI retouch", c.ai_image], ["Restore an old photo", c.restore], ["…and colourise it", `+${c.colourise}`],

let mounted = "";
function mount(id) { mounted = id; $("#view").replaceChildren($("#" + id).content.cloneNode(true)); }
let lastPlace = "#/";          // ahová a fájlnézet „bezárás” gombja visz
let underMaker = "#/";         // a készítő-fiók alatti nézet linkje — bezáráskor ide áll vissza a cím
views.make = async arg => {    // #/make/<eszköz>[/<mód>][?src=<file_id>] — közvetlen linkkel a címlap fölött nyílik
  const [path, qs = ""] = arg.split("?");
  const [slug, modeSlug] = path.split("/");
  const kind = Object.keys(SLUGS).find(k => SLUGS[k] === slug);
  if (!kind) { location.replace("#/"); return; }
  if (!mounted) { history.replaceState(null, "", "#/"); await views.home(); history.replaceState(null, "", "#/make/" + arg); }
  const mode = MODES[kind] && Object.entries(MODES[kind][1]).find(([, w]) => w === modeSlug)?.[0];
  openMaker(kind, { mode, source: new URLSearchParams(qs).get("src") || undefined });
};
async function route() {
  const [, name = "", arg] = location.hash.match(/^#\/([a-z]*)\/?(.*)$/) || [];
  if (name !== "make") { underMaker = location.hash || "#/"; if ($("#drawer").open) $("#drawer").close(); }
  if (!["file", "make"].includes(name)) lastPlace = location.hash || "#/";
  document.querySelectorAll("[data-nav]").forEach(a => a.toggleAttribute("aria-current", a.dataset.nav === (name || "home") ));
  document.querySelectorAll("[data-nav]").forEach(a => a.hasAttribute("aria-current") && a.setAttribute("aria-current", "page"));
  try { await (views[name || "home"] || views.home)(decodeURIComponent(arg || "")); }
  catch (e) { if (e.message !== "signed out") toast(e.message); }
}
window.addEventListener("hashchange", route);
window.addEventListener("message", e => {
  if (e.origin !== location.origin || !e.data || e.data.source !== "wordcraft") return;
  if (e.data.type === "saved") toast(`Saved as ${e.data.label || e.data.name}`);
  if (e.data.type === "save_failed") toast("Couldn't save to your files — it was downloaded instead");
});

async function uploadFile(file) {
  const fd = new FormData(); fd.append("file", file);
  return api("/api/upload", { method: "POST", body: fd });
}
function imagePicker(name, { allowNone = true, ai = true, label = "Image" } = {}) {
  const opts = [["upload", "Upload"], ["stock", "Stock photo"]].concat(ai ? [["ai", account?.guest ? "AI image · account" : "AI image"]] : []).concat(allowNone ? [["none", "None"]] : []);
  return `<fieldset style="border:0;padding:0;margin:0 0 14px"><legend style="font-weight:600;font-size:13px;margin-bottom:6px">${label}</legend>
    <div class="seg" role="radiogroup">${opts.map(([v, t], i) => `<label><input type="radio" name="${name}-src" value="${v}" ${i === 1 ? "checked" : ""}><span>${t}</span></label>`).join("")}</div>
    <input type="file" name="${name}-file" accept="image/*" hidden>
    <input type="text" name="${name}-q" placeholder="What should it show? e.g. city skyline at dusk"></fieldset>`;
}
function wirePicker(form, name) {
  const sync = () => {
    const v = form.querySelector(`[name=${name}-src]:checked`).value;
    form.querySelector(`[name=${name}-file]`).hidden = v !== "upload";
    const q = form.querySelector(`[name=${name}-q]`); q.hidden = !(v === "stock" || v === "ai");
    q.placeholder = v === "ai" ? `Describe the image — costs ${account?.image_credit_cost ?? 1} credit` : "Search words, e.g. city skyline";
  };
  form.querySelectorAll(`[name=${name}-src]`).forEach(r => r.addEventListener("change", sync)); sync();
}
async function readPicker(form, name) {
  const v = form.querySelector(`[name=${name}-src]:checked`)?.value;
  if (v === "upload") {
    const f = form.querySelector(`[name=${name}-file]`).files[0]; if (!f) return null;
    return { file_id: (await uploadFile(f)).file_id };
  }
  const q = form.querySelector(`[name=${name}-q]`)?.value.trim();
  if (!q) return null;
  return v === "ai" ? { ai: q } : v === "stock" ? { stock: q } : null;
}

// „Kérj változtatást”: minden kérés új verzió; a lánc (eredeti → v2 → v3…) a fájlnézet alján
const REVISABLE = ["jpg", "jpeg", "png", "webp", "psd", "tif", "tiff", "docx", "odt", "doc", "rtf", "md", "pptx", "pdf"];
async function wireRevise(f) {
  if (!REVISABLE.includes(f.ext)) return;
  const form = $("#revise"), input = $("#rev-input"), st = $("#rev-status");
  form.hidden = false;
  if (account?.guest) {
    input.disabled = true; $("#rev-go").disabled = true;
    input.placeholder = "Asking for changes uses AI — create a free account to try it";
  }
  const { history } = await api(`/api/revisions?file_id=${encodeURIComponent(f.file_id)}`).catch(() => ({ history: [] }));
  $("#versions").innerHTML = history.length > 1 ? history.map((h, i) => {
    const cur = h.file_id === f.file_id;
    const tip = h.instruction ? `${h.instruction}${h.summary ? " — " + h.summary : ""}` : "The original";
    return `<li><a href="#/file/${encodeURIComponent(h.file_id)}" title="${esc(tip)}" ${cur ? 'aria-current="true"' : ""}>${i ? "v" + (i + 1) : "Original"}</a>${cur && h.instruction ? `<span class="muted">“${esc(h.instruction.slice(0, 90))}”</span>` : ""}</li>`;
  }).join("") : "";
  let styleId = null;
  $("#rev-style").addEventListener("change", async e => {
    const sf = e.target.files[0]; if (!sf) return;
    $("#rev-style-name").textContent = "Uploading…";
    styleId = (await uploadFile(sf)).file_id;
    $("#rev-style-name").textContent = `Style: ${sf.name.slice(0, 18)}`;
    if (!input.value.trim()) input.value = "Restyle it like the example.";
  });
  form.onsubmit = async e => {
    e.preventDefault();
    const instruction = input.value.trim(); if (!instruction && !styleId) { input.focus(); return; }
    const go = $("#rev-go"); go.disabled = true; input.disabled = true;
    try {
      const job = await api("/api/make/revise", { method: "POST", body: JSON.stringify({ file_id: f.file_id, instruction, style_file_id: styleId }) });
      const r = await pollJob(job, () => "Working on it…", st);
      toast(r.summary || "Done — new version");
      await loadAccount();
      location.hash = "#/file/" + encodeURIComponent(r.file_id);
    } catch (err) { st.textContent = err.message; go.disabled = false; input.disabled = false; }
  };
}

function openFill(f, fields) {
  // a nyomtatott felirat (a mező tooltipje, ékezetekkel) — ha nincs, a mezőnévből
  const label = fd => (fd.tooltip || "").replace(/[:\s]+$/, "") || fd.name.replace(/_/g, " ").replace(/^./, c => c.toUpperCase());
  const input = fd => {
    const id = `fv-${fd.name}`;
    if (fd.type === "checkbox") return `<label class="checks" style="margin:0 0 10px"><span><input type="checkbox" name="${esc(fd.name)}" ${fd.value && fd.value !== "Off" ? "checked" : ""}> ${esc(label(fd))}</span></label>`;
    if ((fd.type === "combo" || fd.type === "list" || fd.type === "radio") && fd.options?.length)
      return `<label>${esc(label(fd))}<select name="${esc(fd.name)}"><option value=""></option>${fd.options.map(o => `<option ${o === fd.value ? "selected" : ""}>${esc(o)}</option>`).join("")}</select></label>`;
    return `<label for="${esc(id)}">${esc(label(fd))}<input id="${esc(id)}" type="text" name="${esc(fd.name)}" value="${esc(fd.value || "")}"></label>`;
  };
  MAKERS.fill = {
    cta: "Fill in", title: "Fill in the form", sub: `${fields.length} fields. You get a new PDF; this one stays blank.`,
    fields: () => fields.filter(fd => fd.type !== "button" && fd.type !== "signature" && !fd.read_only).map(input).join("") +
      `<details style="margin:6px 0 14px"><summary style="cursor:pointer;font-weight:600;font-size:13px">Or fill many copies from a spreadsheet</summary>
       <p class="muted small" style="margin:8px 0">CSV or Excel: first row = field names (${esc(fields.slice(0, 4).map(x => x.name).join(", "))}…), one copy per row, all in one PDF.</p>
       <input type="file" name="sheet" accept=".csv,.tsv,.xlsx"></details>
       <label class="checks" style="margin:0 0 6px"><span><input type="checkbox" name="__flat"> Print-ready — the answers can't be changed afterwards</span></label>`,
    wire() {},
    async submit(fd, form) {
      const sheet = form.querySelector("[name=sheet]").files[0], flatten = !!fd.get("__flat");
      if (sheet) {
        const d = await uploadFile(sheet);
        $("#make-status").textContent = "Filling one copy per row…";
        return api("/api/make/fill_form", { method: "POST", body: JSON.stringify({ file_id: f.file_id, data_file_id: d.file_id, flatten }) });
      }
      const values = {};
      for (const fdx of fields) {
        const el = form.querySelector(`[name="${CSS.escape(fdx.name)}"]`); if (!el) continue;
        values[fdx.name] = el.type === "checkbox" ? el.checked : el.value;
      }
      return api("/api/make/fill_form", { method: "POST", body: JSON.stringify({ file_id: f.file_id, values, flatten }) });
    },
  };

  form.innerHTML = `<h2 id="drawer-title">${m.title}</h2><p class="muted" style="margin:0 0 20px">${m.sub}</p>${m.fields()}
    <p class="status" id="make-status"></p>
    <div class="actions"><button class="btn ghost" value="cancel" formnovalidate>Cancel</button>${m.alt ? `<button class="btn" id="make-alt" value="alt"${m.altLoose ? " formnovalidate" : ""}>${m.alt}</button>` : ""}<button class="btn primary" id="make-go" value="go">${m.cta || "Make it"}</button></div>`;
  m.wire?.(form, opts);
  const [field, words] = MODES[kind] || [];
  if (field) {
    if (opts.mode) { const r = form.querySelector(`[name=${field}][value=${opts.mode}]`); if (r) { r.checked = true; r.dispatchEvent(new Event("change", { bubbles: true })); } }
    form.querySelectorAll(`[name=${field}]`).forEach(r => r.addEventListener("change", () => {
      if (location.hash.startsWith("#/make/")) history.replaceState(null, "", makeLink(kind, r.value, opts.source));
    }));
  }
  form.onsubmit = async e => {
    if (!["go", "alt"].includes(e.submitter?.value)) return;
    e.preventDefault();
    const go = $("#make-go"), alt = $("#make-alt"); go.disabled = true; if (alt) alt.disabled = true;
    $("#make-status").textContent = "Working on it — this takes a few seconds…";
    try {
      const r = await m.submit(new FormData(form), form, { alt: e.submitter.value === "alt" });
      if (location.hash.startsWith("#/make/")) history.replaceState(null, "", underMaker);   // a Vissza ne nyissa újra a fiókot
      $("#drawer").close(); await loadAccount();
      toast(r.msg || (r.n > 1 ? `Done — ${r.n} files are in your files` : "Done"));
      location.hash = "#/file/" + encodeURIComponent(r.file_id) + (r.edit ? "/edit" : "");
    } catch (err) { $("#make-status").textContent = err.message; go.disabled = false; if (alt) alt.disabled = false; }
  };
  $("#drawer").showModal();
}

$("#drawer-x").addEventListener("click", () => $("#drawer").close());
let invalidShown = false;
$("#make-form").addEventListener("pointerdown", e => { if (e.target.closest(".actions")) invalidShown = false; }, true);
$("#make-form").addEventListener("keydown", e => { if (e.key === "Enter") invalidShown = false; }, true);
$("#make-form").addEventListener("invalid", e => {      // a böngésző buborékja gyorsan eltűnik — legyen jól látható
  const el = e.target;
  el.classList.add("needs");
  el.addEventListener("input", () => el.classList.remove("needs"), { once: true });
  el.addEventListener("change", () => el.classList.remove("needs"), { once: true });
  if (invalidShown) return;
  invalidShown = true;
  const lab = el.closest("label"), name = lab ? (lab.firstChild?.textContent || "").trim() : "";
  $("#make-status").textContent = name ? `Fill in “${name}” first.` : "Fill in the highlighted field first.";
  el.scrollIntoView({ block: "center", behavior: "smooth" });
}, true);
$("#drawer").addEventListener("close", () => { if (location.hash.startsWith("#/make/")) history.replaceState(null, "", underMaker); });
$("#drawer").addEventListener("click", e => {          // kattintás a fiók mellé (a sötét háttérre) = bezárás
  if (e.target === e.currentTarget && e.clientX < e.currentTarget.getBoundingClientRect().left) e.currentTarget.close();
});
loadAccount().catch(() => {}); route();
</script>
</body>
