[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aice"
version = "1.0.0"
description = "Python SDK for the file conversion, tools, forms and signatures REST API (/v1)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["httpx>=0.24"]
license = {text = "MIT"}

[tool.setuptools]
packages = ["aice"]
